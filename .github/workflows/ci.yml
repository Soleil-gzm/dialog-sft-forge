name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Smoke test - generate demo data
        run: python demo/generate_demo_data.py

      - name: Smoke test - generate dialogues
        run: python scripts_general/main.py -c demo/demo_config.yaml
