# ============================================
# 奶茶店会员回访 - 批量任务列表
# 每个任务仅需写差异化配置，其余继承 base.yaml
# ============================================

base: "base.yaml"

tasks:
  # ---------- 1. VIP 会员回访 ----------
  - name: "VIP会员回访"
    enabled: true
    task_name: "milktea_vip_callback"
    num_paths: 2000
    random_seed: 11
    excel_path: "demo/data/话术模板.xlsx"
    prob_path: "demo/data/prob.xlsx"
    prob_auto_generate:
      enabled: true
      categories_yaml: "demo/config/categories.yaml"
      compress_mode: "log"
    case_loader:
      type: "split"
      replace_dir: "demo/data/case/cases"
      system_dir: "demo/data/case/prompts"
    case_auto_generate:
      enabled: true
      generator_type: "milktea"
      num_cases: 2000
      prompt_system_path: "demo/prompt/system.txt"
      prompt_replace_path: "demo/prompt/replace.txt"
      force_regenerate: false

