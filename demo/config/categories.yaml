# demo/categories.yaml
# 奶茶店会员回访场景 — prob 矩阵生成配置
# 用法: python -m excel2prob.run（需修改 run.py 里的路径指向 demo/data）

# ============================================================
# 模块分类
# ============================================================

# A 类：路径中只出现一次（流失类，自循环权重高）
A:
  - 流失风险
  - 投诉处理

# B 类：可重复出现的对话模块
B:
  - 身份确认
  - 身份核实
  - 积分告知
  - 权益介绍
  - 活动推荐
  - 无意愿
  - 犹豫跟进
  - 承诺到店
  - 预约到店

# C 类：自定义模块（终止类，手动指定候选集）
C:
  - 已到店
  - 明确拒绝
  - 通话结束

# ============================================================
# 手动候选集：覆盖默认出边规则
# ============================================================
manual:
  # 起始模块：身份确认 → 核实/告知/活动/流失/留言
  身份确认:
    - 身份核实
    - 积分告知
    - 活动推荐
    - 流失风险
    - 语音留言

  身份核实:
    - 积分告知
    - 权益介绍
    - 活动推荐
    - 无意愿
    - 投诉处理

  积分告知:
    - 权益介绍
    - 活动推荐
    - 无意愿
    - 犹豫跟进
    - 承诺到店
    - 通话结束

  权益介绍:
    - 活动推荐
    - 犹豫跟进
    - 无意愿
    - 承诺到店
    - 预约到店
    - 通话结束

  活动推荐:
    - 无意愿
    - 犹豫跟进
    - 承诺到店
    - 预约到店
    - 流失风险
    - 已到店

  无意愿:
    - 犹豫跟进
    - 活动推荐
    - 流失风险
    - 承诺到店
    - 明确拒绝
    - 通话结束

  犹豫跟进:
    - 活动推荐
    - 承诺到店
    - 预约到店
    - 无意愿
    - 流失风险
    - 通话结束

  承诺到店:
    - 已到店
    - 预约到店
    - 活动推荐
    - 通话结束

  预约到店:
    - 已到店
    - 权益介绍
    - 通话结束

  # A 类模块：手动指定候选集（覆盖默认的 A+B+C 展开）
  流失风险:
    - 投诉处理
    - 活动推荐
    - 承诺到店
    - 无意愿
    - 明确拒绝
    - 通话结束

  投诉处理:
    - 活动推荐
    - 承诺到店
    - 犹豫跟进
    - 明确拒绝
    - 通话结束

  # 终止模块：自循环锁死
  语音留言:
    - 语音留言

  已到店:
    - 已到店

  明确拒绝:
    - 明确拒绝

  通话结束:
    - 通话结束

# ============================================================
# 固定概率：精确指定某些转移的百分比
# ============================================================
fixed_prob:
  身份确认:
    身份核实: 55

  承诺到店:
    已到店: 60
    通话结束: 15

  预约到店:
    已到店: 70
    通话结束: 20

  流失风险:
    投诉处理: 20

  投诉处理:
    通话结束: 20

  语音留言:
    语音留言: 100

  已到店:
    已到店: 100

  明确拒绝:
    明确拒绝: 100

  通话结束:
    通话结束: 100

# ============================================================
# 业务偏好（可选，调整概率分布）
# ============================================================

# 单模块倍数：权重 × 该倍数
boost:
  活动推荐: 2.0     # 促销活动是高频话题
  无意愿: 1.5        # 客户抗拒常见
  犹豫跟进: 1.5      # 需要多轮跟进
  身份核实: 0.8      # 核实后快速进入正题
  投诉处理: 0.5      # 投诉不常见

# 自循环全局倍数：模块跳回自己时的权重倍数
self_loop_boost:
  A: 1.5             # A 类自循环略高（客户反复纠结）
  B: 3.0             # B 类自循环较高（多轮拉扯）
  default: 5.0        # 终止/语音留言锁死

# 自循环单模块覆盖
self_loop_boost_override:
  语音留言: 100      # 语音留言锁死，不再跳转
  已到店: 100
  明确拒绝: 100
  通话结束: 100
